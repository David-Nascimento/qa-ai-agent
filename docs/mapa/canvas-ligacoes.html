<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ligações do QA AI Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --dot: #262a33;
        --panel: #171a21;
        --panel2: #1d2129;
        --line: #2a2f3a;
        --line2: #353b48;
        --fg: #e8eaef;
        --fg2: #a9afbc;
        --fg3: #737a89;
        --ok: #4fd17a;
        --hot: #ff7a93;
        --accent: #5b9cff;
        --note: #f59e3b;
        --note-bg: #3a2a12;
        --note-fg: #ffe2bd;
        --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 var(--sans);
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      #vp {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
        background-size: 22px 22px;
      }
      #vp.drag {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #wires {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      #wires path {
        fill: none;
        stroke-width: 1.5;
        transition: opacity 0.15s;
      }
      #wires path.loop {
        stroke-dasharray: 5 5;
      }
      #wires .lbl rect {
        fill: var(--panel2);
        stroke: var(--line2);
      }
      #wires .lbl text {
        fill: var(--fg2);
        font: 11px var(--sans);
      }
      .colh {
        position: absolute;
        top: 0;
        width: 300px;
      }
      .colh b {
        display: block;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg);
      }
      .colh span {
        font-size: 12px;
        color: var(--fg3);
      }
      .colh i {
        display: block;
        height: 2px;
        width: 36px;
        margin-top: 8px;
        border-radius: 2px;
      }
      .node {
        position: absolute;
        width: 300px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition:
          opacity 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .node:hover {
        border-color: var(--line2);
      }
      .node:focus-visible {
        outline: 2px solid var(--k);
        outline-offset: 3px;
      }
      .node.sel {
        border-color: var(--k);
        box-shadow:
          0 0 0 1px var(--k),
          0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .node .hd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--k);
        font-weight: 600;
      }
      .node .hd .sq {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--k);
      }
      .node .hd .n {
        margin-left: auto;
        color: var(--fg3);
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }
      .node .bd {
        padding: 10px 12px 12px;
        display: grid;
        gap: 6px;
      }
      .node h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        text-wrap: balance;
      }
      .node .wh {
        font: 11px/1.4 var(--mono);
        color: var(--fg3);
        word-break: break-word;
      }
      .node p {
        margin: 0;
        color: var(--fg2);
        font-size: 12.5px;
      }
      .node .fx {
        margin: 2px 0 0;
        padding: 7px 9px;
        background: #0b0d11;
        border: 1px solid var(--line);
        border-radius: 7px;
        font: 11px/1.5 var(--mono);
        color: #d8dce4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .node .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        font: 10.5px var(--mono);
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--fg2);
      }
      .chip.code {
        color: var(--ok);
      }
      .port {
        position: absolute;
        top: 15px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--k);
      }
      .port.in {
        left: -6px;
      }
      .port.out {
        right: -6px;
      }
      .note {
        position: absolute;
        width: 300px;
        padding: 12px 14px;
        background: var(--note-bg);
        border: 1px solid var(--note);
        border-radius: 10px;
        color: var(--note-fg);
        font-size: 12.5px;
        white-space: pre-line;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
      .note::first-line {
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--note);
      }
      .dim {
        opacity: 0.13;
      }
      /* barra superior */
      #top {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        background: linear-gradient(var(--bg) 60%, transparent);
        pointer-events: none;
      }
      #top > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand .lg {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--panel2);
        border: 1px solid var(--line2);
        font: 600 12px var(--mono);
        color: var(--accent);
      }
      .brand b {
        display: block;
        font-size: 14px;
      }
      .brand small {
        color: var(--fg3);
        font-size: 12px;
      }
      .srch {
        position: relative;
        flex: 1 1 220px;
        max-width: 340px;
      }
      .srch input {
        width: 100%;
        padding: 8px 12px;
        border-radius: 9px;
        background: var(--panel);
        border: 1px solid var(--line2);
        outline: none;
      }
      .srch input:focus {
        border-color: var(--accent);
      }
      #res {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      #res button {
        display: flex;
        gap: 8px;
        align-items: baseline;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        padding: 8px 12px;
        cursor: pointer;
      }
      #res button:hover,
      #res button:focus {
        background: var(--panel2);
        outline: none;
      }
      #res small {
        color: var(--fg3);
        font: 11px var(--mono);
        margin-left: auto;
        white-space: nowrap;
      }
      .legend {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        max-width: 100%;
        scrollbar-width: none;
      }
      .legend button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--fg2);
        cursor: pointer;
        white-space: nowrap;
      }
      .legend button i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--k);
      }
      .legend button.on {
        border-color: var(--k);
        color: var(--fg);
      }
      .lnk {
        margin-left: auto;
        font-size: 12.5px;
        color: var(--fg2);
        text-decoration: none;
        padding: 6px 10px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: var(--panel);
      }
      .lnk:hover {
        color: var(--fg);
      }
      /* barra de zoom */
      #zoom {
        position: fixed;
        z-index: 20;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #zoom button {
        min-width: 34px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: none;
        cursor: pointer;
        color: var(--fg2);
        padding: 0 10px;
      }
      #zoom button:hover {
        background: var(--panel2);
        color: var(--fg);
      }
      #zoom button.on {
        color: var(--fg);
        background: var(--panel2);
      }
      #zoom .pc {
        min-width: 52px;
        text-align: center;
        font: 12px var(--mono);
        color: var(--fg3);
      }
      #zoom .sep {
        width: 1px;
        height: 20px;
        background: var(--line2);
        margin: 0 4px;
      }
      /* painel lateral */
      #dr {
        position: fixed;
        z-index: 30;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(480px, 100%);
        background: var(--panel);
        border-left: 1px solid var(--line2);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        box-shadow: -20px 0 40px rgba(0, 0, 0, 0.4);
      }
      #dr.open {
        transform: none;
      }
      #dr header {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      #dr header .t {
        flex: 1;
        min-width: 0;
      }
      #dr .ty {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--k);
      }
      #dr h2 {
        margin: 4px 0 4px;
        font-size: 19px;
        line-height: 1.25;
        text-wrap: balance;
      }
      #dr .wh {
        font: 12px/1.4 var(--mono);
        color: var(--fg3);
        word-break: break-word;
      }
      #dr .x {
        border: 1px solid var(--line2);
        background: var(--panel2);
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        flex: none;
      }
      #dr .sc {
        overflow-y: auto;
        padding: 16px 18px calc(28px + env(safe-area-inset-bottom, 0px));
        padding-right: max(18px, env(safe-area-inset-right, 0px));
        display: grid;
        gap: 20px;
        align-content: start;
      }
      #dr section {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      #dr h4 {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--fg3);
        font-weight: 600;
      }
      #dr p {
        margin: 0;
        color: var(--fg2);
        max-width: 65ch;
      }
      #dr .fx {
        margin: 0;
        padding: 10px 12px;
        background: #0b0d11;
        border: 1px solid var(--line);
        border-radius: 9px;
        font: 12px/1.6 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
      #dr ol {
        margin: 0;
        padding-left: 20px;
        color: var(--fg2);
        display: grid;
        gap: 5px;
      }
      #dr .warn {
        padding: 9px 12px;
        border-radius: 9px;
        background: var(--note-bg);
        border: 1px solid var(--note);
        color: var(--note-fg);
        font-size: 13px;
      }
      .io {
        display: grid;
        gap: 4px;
      }
      .io button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 7px 10px;
        border-radius: 8px;
        background: var(--panel2);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .io button:hover {
        border-color: var(--line2);
      }
      .io button i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--k);
        flex: none;
      }
      .io button small {
        margin-left: auto;
        color: var(--fg3);
        font-size: 11.5px;
        text-align: right;
      }
      .io .none {
        color: var(--fg3);
        font-size: 13px;
      }
      .rn {
        display: grid;
        gap: 6px;
      }
      .rn div {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel2);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--fg2);
      }
      .rn b {
        font: 500 11px var(--mono);
        color: var(--hot);
        white-space: nowrap;
        padding-top: 2px;
      }
      details.cd {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #0b0d11;
        min-width: 0;
      }
      details.cd summary {
        cursor: pointer;
        padding: 8px 12px;
        font: 12px var(--mono);
        color: var(--ok);
        list-style: none;
        display: flex;
        gap: 8px;
      }
      details.cd summary::before {
        content: '▸';
        color: var(--fg3);
      }
      details.cd[open] summary::before {
        content: '▾';
      }
      details.cd pre {
        margin: 0;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        overflow-x: auto;
        font: 11.5px/1.55 var(--mono);
        color: #d8dce4;
        max-height: 460px;
      }
      .kw {
        color: #c792ea;
      }
      .st {
        color: #c3e88d;
      }
      .cm {
        color: #6b7385;
        font-style: italic;
      }
      .nu {
        color: #f78c6c;
      }
      @media (max-width: 640px) {
        .lnk {
          display: none;
        }
        #dr {
          top: auto;
          height: 82%;
          width: 100%;
          border-left: 0;
          border-top: 1px solid var(--line2);
          border-radius: 16px 16px 0 0;
          transform: translateY(100%);
        }
        #dr header {
          padding-top: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="vp" aria-label="Canvas de ligações">
      <div id="world"><svg id="wires"></svg></div>
    </div>

    <div id="top">
      <div class="brand">
        <div class="lg" id="sig"></div>
        <div><b id="ttl"></b><small id="cnt"></small></div>
      </div>
      <div class="srch">
        <input
          id="q"
          type="search"
          placeholder="Buscar função, métrica ou tela…"
          autocomplete="off"
          aria-label="Buscar no canvas"
        />
        <div id="res" hidden></div>
      </div>
      <div class="legend" id="leg"></div>
      <a class="lnk" id="lnkmapa" href="mapa-funcionalidades.html">Mapa de funcionalidades ↗</a>
    </div>

    <div id="zoom">
      <button id="zo" aria-label="Diminuir zoom">−</button><span class="pc" id="zp">100%</span
      ><button id="zi" aria-label="Aumentar zoom">+</button> <span class="sep"></span><button id="zf">Ajustar</button
      ><button id="zl" aria-pressed="false">Rótulos</button>
    </div>

    <aside id="dr" aria-label="Detalhes do nó">
      <header>
        <div class="t">
          <div class="ty" id="dty"></div>
          <h2 id="dt"></h2>
          <div class="wh" id="dw"></div>
        </div>
        <button class="x" id="dx" aria-label="Fechar">✕</button>
      </header>
      <div class="sc" id="dc"></div>
    </aside>

    <script>
      const D = {
        titulo: 'Ligações do QA AI Agent',
        sigla: 'QA',
        mapa: 'mapa-funcionalidades.html',
        cats: {
          fonte: { nome: 'Fonte', cor: '#f2a93b', detalhe: 'Formato' },
          servidor: { nome: 'Servidor', cor: '#5b9cff', detalhe: 'Formato' },
          portal: { nome: 'Portal', cor: '#36c2b4', detalhe: 'Formato' },
          dados: { nome: 'Dados', cor: '#a78bfa', detalhe: 'Formato' },
          calculo: { nome: 'Cálculo', cor: '#4fd17a', detalhe: 'Fórmula' },
          metrica: { nome: 'Métrica', cor: '#ff7a93', detalhe: 'Fórmula' },
          tela: { nome: 'Tela', cor: '#c9ced8', detalhe: 'Formato' },
        },
        cols: [
          ['Fontes e gatilhos', 'De onde os dados e as ações nascem'],
          ['Servidor · entrada', 'Segurança, descoberta e comandos'],
          ['Servidor · acompanhamento', 'Um laço por build em andamento'],
          ['Servidor · leitura do build', 'Log, estágios e resultado'],
          ['Servidor · saída', 'Eventos em tempo real e Jira'],
          ['Portal · entrada', 'Como os dados entram na tela'],
          ['Dados em memória', 'O que o portal guarda'],
          ['Funções de cálculo', 'Onde as métricas são calculadas'],
          ['Métricas', 'Cada número e sua fórmula'],
          ['Telas', 'Onde cada métrica aparece'],
        ],
        nodes: [
          {
            id: 'src_jenkins',
            col: 0,
            cat: 'fonte',
            title: 'Jenkins',
            where: 'API REST · Basic Auth (usuário + API token)',
            body: 'Builds, log do console, estágios e relatório de testes de cada job configurado.',
            formula: null,
            fl: 'Formato',
            steps: [
              'Lido pelo servidor, nunca pelo navegador.',
              'Endpoints: /job/…/api/json (builds), /…/logText/progressiveText (log), /…/wfapi/describe (estágios), /…/testReport/api/json (totais), /…/build e /…/stop (comandos).',
              'Jobs em pastas viram /job/Pasta/job/Job.',
            ],
            rules: [
              {
                id: 'RN-JEN-07',
                t: 'Credenciais do Jenkins ficam só no servidor (.env), de preferência cifradas (RN-SEG-01).',
              },
            ],
            code: [],
            note: null,
          },
          {
            id: 'src_github',
            col: 0,
            cat: 'fonte',
            title: 'GitHub Actions',
            where: 'API REST · token (Bearer)',
            body: 'Runs, jobs e logs dos workflows configurados.',
            formula: null,
            fl: 'Formato',
            steps: [
              'Lido pelo servidor, nunca pelo navegador.',
              'Endpoints: /repos/…/actions/workflows/…/runs (runs), /actions/runs/{id} e /jobs (andamento), /actions/jobs/{id}/logs (cenários), /dispatches e /cancel (comandos).',
              'Usa ETag: respostas 304 não gastam o limite do token.',
            ],
            rules: [
              {
                id: 'RN-GHA-05',
                t: 'Respostas condicionais por ETag: se nada mudou o GitHub devolve 304, que não consome o limite de 5.000 chamadas por hora do token.',
              },
              {
                id: 'RN-GHA-08',
                t: 'O token do GitHub fica só no servidor (.env), de preferência cifrado (RN-SEG-01).',
              },
            ],
            code: [],
            note: null,
          },
          {
            id: 'src_jira',
            col: 0,
            cat: 'fonte',
            title: 'Jira',
            where: 'API REST v3 (Cloud) ou v2 (Server/DC)',
            body: 'Cenários de teste por consulta (JQL) e bugs abertos para falhas.',
            formula: null,
            fl: 'Formato',
            steps: [
              'Busca: /rest/api/3/search/jql (Cloud) ou /rest/api/2/search (Server).',
              'Criação: POST /issue · comentário: POST /issue/{chave}/comment.',
              'Autenticação: e-mail + API token (Cloud) ou token pessoal (Server).',
              'Sincronização incremental: a consulta ganha “updated >= -Nm”.',
              'Jira Data Center aceita token pessoal (JIRA_AUTH=bearer).',
            ],
            rules: [
              { id: 'RN-JIR-04', t: 'Funciona com Jira Cloud (API v3) e Server/Data Center (API v2).' },
              {
                id: 'RN-JIR-05',
                t: 'Credenciais do Jira ficam só no servidor (.env), de preferência cifradas (RN-SEG-01).',
              },

        });
        world.style.width = 40 + D.cols.length * CW + 'px';
        world.style.height = maxH + 'px';
        bounds = { w: 40 + D.cols.length * CW, h: maxH };
        drawWires();
      }

      let bounds = { w: 1, h: 1 },
        labels = false,
        selId = null,
        lit = null;
      function geom(e) {
        const a = byId[e.a],
          b = byId[e.b];
        const y1 = a.y + 20,
          y2 = b.y + 20;
        if (a.col === b.col) {
          const x = a.x + W,
            bend = 46 + Math.min(60, Math.abs(y2 - y1) / 10);
          return {
            d: `M${x},${y1} C${x + bend},${y1} ${x + bend},${y2} ${x},${y2}`,
            loop: true,
            mx: x + bend * 0.75,
            my: (y1 + y2) / 2,
          };
        }
        const x1 = a.x + W,
          x2 = b.x,
          dx = Math.max(70, (x2 - x1) / 2);
        const p = [
          [x1, y1],
          [x1 + dx, y1],
          [x2 - dx, y2],
          [x2, y2],
        ];
        return {
          d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`,
          mx: (p[0][0] + 3 * p[1][0] + 3 * p[2][0] + p[3][0]) / 8,
          my: (p[0][1] + 3 * p[1][1] + 3 * p[2][1] + p[3][1]) / 8,
        };
      }
      function drawWires() {
        svg.setAttribute('width', bounds.w);
        svg.setAttribute('height', bounds.h);
        let h = '',
          lb = '';
        D.edges.forEach((e, i) => {
          const g = geom(e),
            on = !lit || (lit.has(e.a) && lit.has(e.b));
          const strong = lit && on;
          h += `<path class="${g.loop ? 'loop' : ''}" d="${g.d}" stroke="${kvar(byId[e.a].cat)}" stroke-width="${strong ? 2.2 : 1.5}" opacity="${!lit ? 0.5 : on ? 1 : 0.05}"/>`;
          if (e.l && (labels || strong)) {
            const w = e.l.length * 6 + 14;
            lb += `<g class="lbl"><rect x="${g.mx - w / 2}" y="${g.my - 10}" width="${w}" height="20" rx="6"/><text x="${g.mx}" y="${g.my + 4}" text-anchor="middle">${esc(e.l)}</text></g>`;
          }
        });
        svg.innerHTML = h + lb;
      }

      // ---------- câmera
      const vp = $('#vp');
      let cam = { x: 0, y: 0, k: 1 };
      function apply() {
        world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
        $('#zp').textContent = Math.round(cam.k * 100) + '%';
      }
      function zoomAt(k, cx, cy) {
        k = Math.min(2.2, Math.max(0.12, k));
        cam.x = cx - (cx - cam.x) * (k / cam.k);
        cam.y = cy - (cy - cam.y) * (k / cam.k);
        cam.k = k;
        apply();
      }
      function fit(widthOnly) {
        const r = vp.getBoundingClientRect(),
          padT = $('#top').offsetHeight + 10,
          padB = 70;
        const kw = (r.width - 40) / bounds.w,
          kh = (r.height - padT - padB) / bounds.h;
        const k = Math.min(1, Math.max(0.12, widthOnly === true ? Math.max(kw, 0.3) : Math.min(kw, kh)));
        cam = { k, x: Math.max(20, (r.width - bounds.w * k) / 2), y: padT };
        apply();
      }
      function centerOn(n) {
        const r = vp.getBoundingClientRect(),
          k = Math.max(cam.k, 0.85);
        const drawer = $('#dr').classList.contains('open') && r.width > 640 ? $('#dr').offsetWidth : 0;
        const bottom = r.width <= 640 && $('#dr').classList.contains('open') ? r.height * 0.82 : 0;
        cam.k = k;
        cam.x = (r.width - drawer) / 2 - (n.x + W / 2) * k;
        cam.y = (r.height - bottom) / 2 - (n.y + Math.min(n.h, 260) / 2) * k + (bottom ? 20 : 0);
        apply();
      }
      vp.addEventListener(
        'wheel',
        ev => {
          ev.preventDefault();
          if (
            ev.ctrlKey ||
            (Math.abs(ev.deltaY) > 0 && !ev.shiftKey && Math.abs(ev.deltaX) < 1 && ev.deltaMode !== 0) ||
            ev.ctrlKey
          ) {
          }
          if (ev.ctrlKey || (!ev.deltaX && Math.abs(ev.deltaY) >= 40))
            zoomAt(cam.k * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015)), ev.clientX, ev.clientY);
          else {
            cam.x -= ev.deltaX;
            cam.y -= ev.deltaY;
            apply();
          }
        },
        { passive: false }
      );
      const ptrs = new Map();
      let moved = false,
        start = null,
        pinch = null;
      vp.addEventListener('pointerdown', ev => {
        if (ev.button !== 0 && ev.pointerType === 'mouse') return;
        ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        moved = false;
        start = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y };
        if (ptrs.size === 2) {
          const [a, b] = [...ptrs.values()];
          pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: cam.k };
        }
      });
      window.addEventListener('pointermove', ev => {
        if (!ptrs.has(ev.pointerId)) return;
        ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (ptrs.size === 2 && pinch) {
          const [a, b] = [...ptrs.values()];
          zoomAt((pinch.k * Math.hypot(a.x - b.x, a.y - b.y)) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
          moved = true;
          return;
        }
        const dx = ev.clientX - start.x,
          dy = ev.clientY - start.y;
        if (!moved && Math.hypot(dx, dy) > 4) {
          moved = true;
          vp.classList.add('drag');
          try {
            vp.setPointerCapture(ev.pointerId);
          } catch {}
        }
        if (moved) {
          cam.x = start.cx + dx;
          cam.y = start.cy + dy;
          apply();
        }
      });
      const up = ev => {
        ptrs.delete(ev.pointerId);
        if (ptrs.size < 2) pinch = null;
        vp.classList.remove('drag');
        if ((!moved && ev.target === vp) || ev.target === world) {
          if (!moved) clearSel();
        }
        setTimeout(() => {
          if (!ptrs.size) moved = false;
        }, 0);
      };
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      $('#zi').onclick = () => {
        const r = vp.getBoundingClientRect();
        zoomAt(cam.k * 1.2, r.width / 2, r.height / 2);
      };
      $('#zo').onclick = () => {
        const r = vp.getBoundingClientRect();
        zoomAt(cam.k / 1.2, r.width / 2, r.height / 2);
      };
      $('#zf').onclick = () => fit();
      $('#zl').onclick = () => {
        labels = !labels;
        $('#zl').classList.toggle('on', labels);
        $('#zl').setAttribute('aria-pressed', labels);
        drawWires();
      };

      // ---------- destaque do caminho
      function walk(id, dir) {
        const seen = new Set([id]),
          st = [id];
        while (st.length) {
          const c = st.pop();
          (dir === 'up' ? ins[c] : outs[c]).forEach(e => {
            const nx = dir === 'up' ? e.a : e.b;
            if (!seen.has(nx)) {
              seen.add(nx);
              st.push(nx);
            }
          });
        }
        return seen;
      }
      function paint() {
        D.nodes.forEach(n => {
          n.el.classList.toggle('dim', !!lit && !lit.has(n.id));
          n.el.classList.toggle('sel', n.id === selId);
        });
        notes.forEach(t => t.el.classList.toggle('dim', !!lit));
        drawWires();
      }
      let catOn = null;
      function clearSel() {
        selId = null;
        lit = null;
        catOn = null;
        $('#dr').classList.remove('open');
        document.querySelectorAll('.legend button').forEach(b => b.classList.remove('on'));
        try {
          history.replaceState(null, '', location.pathname + location.search);
        } catch {}
        paint();
      }

      // ---------- realce de código
      function hl(src) {
        const re =
          /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|\b(const|let|var|function|async|await|return|if|else|for|of|in|while|new|try|catch|throw|break|continue|null|true|false|undefined|typeof|switch|case|default)\b|\b(\d+(?:\.\d+)?)\b/g;
        let out = '',
          last = 0,
          m;
        while ((m = re.exec(src))) {
          out += esc(src.slice(last, m.index));
          out += `<span class="${m[1] ? 'cm' : m[2] ? 'st' : m[3] ? 'kw' : 'nu'}">${esc(m[0])}</span>`;
          last = re.lastIndex;
        }
        return out + esc(src.slice(last));
      }

      // ---------- painel
      function ioList(list, key) {
        if (!list.length) return '<div class="none">Nenhuma</div>';
        return list
          .map(e => {
            const o = byId[e[key]];
            return `<button data-go="${o.id}" style="--k:${kvar(o.cat)}"><i></i><span>${esc(o.title)}</span><small>${esc(e.l || CAT[o.cat].n)}</small></button>`;
          })
          .join('');
      }
      function select(id, center) {
        const n = byId[id];
        if (!n) return;
        selId = id;
        catOn = null;
        document.querySelectorAll('.legend button').forEach(b => b.classList.remove('on'));
        lit = new Set([...walk(id, 'up'), ...walk(id, 'down')]);
        paint();
        const dr = $('#dr');
        dr.style.setProperty('--k', kvar(n.cat));
        $('#dty').textContent = CAT[n.cat].n + ' · coluna ' + (n.col + 1) + ' · ' + D.cols[n.col][0];
        $('#dt').textContent = n.title;
        $('#dw').textContent = n.where;
        $('#dw').hidden = !n.where;
        const up = walk(id, 'up').size - 1,
          dn = walk(id, 'down').size - 1;
        let h = `<section><h4>O que faz</h4><p>${esc(n.body)}</p></section>`;
        if (n.note) h += `<div class="warn">${esc(n.note)}</div>`;
        if (n.formula)
          h += `<section><h4>${esc(n.fl || 'Fórmula')}</h4><pre class="fx">${esc(n.formula)}</pre></section>`;
        if (n.steps.length)
          h += `<section><h4>Passo a passo</h4><ol>${n.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></section>`;
        h += `<section><h4>Recebe de (${ins[id].length})</h4><div class="io">${ioList(ins[id], 'a')}</div></section>`;
        h += `<section><h4>Envia para (${outs[id].length})</h4><div class="io">${ioList(outs[id], 'b')}</div></section>`;
        h += `<section><h4>Caminho completo</h4><p>${up} nó${up === 1 ? '' : 's'} antes e ${dn} depois deste estão acesos no canvas.</p></section>`;
        if (n.rules.length)
          h += `<section><h4>Regras de negócio</h4><div class="rn">${n.rules.map(r => `<div><b>${r.id}</b><span>${esc(r.t)}</span></div>`).join('')}</div></section>`;
        if (n.code.length)
          h += `<section><h4>Código real (${n.code.length})</h4>${n.code.map((c, i) => `<details class="cd"${i === 0 ? ' open' : ''}><summary>${esc(c.f)}</summary><pre>${hl(c.c)}</pre></details>`).join('')}</section>`;
        $('#dc').innerHTML = h;
        $('#dc').scrollTop = 0;
        dr.classList.add('open');
        try {
          history.replaceState(null, '', '#' + id.replace(/_/g, '-'));
        } catch {}
        if (center) centerOn(n);
      }
      $('#dc').addEventListener('click', ev => {
        const b = ev.target.closest('[data-go]');
        if (b) select(b.dataset.go, true);
      });
      $('#dx').onclick = clearSel;
      document.addEventListener('keydown', ev => {
        if (ev.key === 'Escape') {
          $('#res').hidden = true;
          clearSel();
        }
      });

      // ---------- legenda
      Object.entries(CAT).forEach(([k, v]) => {
        const b = document.createElement('button');
        b.style.setProperty('--k', kvar(k));
        b.innerHTML = `<i></i>${v.n} <span style="color:var(--fg3)">${D.nodes.filter(n => n.cat === k).length}</span>`;
        b.onclick = () => {
          if (catOn === k) return clearSel();
          selId = null;
          catOn = k;
          $('#dr').classList.remove('open');
          lit = new Set(D.nodes.filter(n => n.cat === k).map(n => n.id));
          document.querySelectorAll('.legend button').forEach(x => x.classList.toggle('on', x === b));
          paint();
        };
        $('#leg').appendChild(b);
      });

      // ---------- busca
      const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      $('#q').addEventListener('input', () => {
        const q = norm($('#q').value.trim()),
          res = $('#res');
        if (!q) {
          res.hidden = true;
          return;
        }
        const hits = D.nodes
          .map(n => {
            const t = norm(n.title),
              hay = norm(
                [
                  n.where,
                  n.body,
                  n.formula || '',
                  n.code.map(c => c.f).join(' '),
                  n.rules.map(r => r.id).join(' '),
                ].join(' ')
              );
            return { n, s: t.includes(q) ? (t.startsWith(q) ? 3 : 2) : hay.includes(q) ? 1 : 0 };
          })
          .filter(h => h.s)
          .sort((a, b) => b.s - a.s)
          .slice(0, 8);
        res.innerHTML = hits.length
          ? hits
              .map(
                h =>
                  `<button data-id="${h.n.id}" style="--k:${kvar(h.n.cat)}"><span>${esc(h.n.title)}</span><small>${CAT[h.n.cat].n}</small></button>`
              )
              .join('')
          : '<button disabled><span style="color:var(--fg3)">Nada encontrado</span></button>';
        res.hidden = false;
      });
      $('#q').addEventListener('keydown', ev => {
        if (ev.key === 'Enter') {
          const b = $('#res button[data-id]');
          if (b) b.click();
        }
      });
      $('#res').addEventListener('click', ev => {
        const b = ev.target.closest('[data-id]');
        if (!b) return;
        $('#res').hidden = true;
        $('#q').blur();
        select(b.dataset.id, true);
      });
      document.addEventListener('pointerdown', ev => {
        if (!ev.target.closest('.srch')) $('#res').hidden = true;
      });

      // ---------- início
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        layout();
        fit(true);
        const h = location.hash.slice(1).replace(/-/g, '_');
        if (byId[h]) select(h, true);
      });
      window.addEventListener('resize', () => {
        if (!selId) fit(true);
      });
      window.addEventListener('hashchange', () => {
        const h = location.hash.slice(1).replace(/-/g, '_');
        if (byId[h] && h !== selId) select(h, true);
      });
    </script>
  </body>
</html>
