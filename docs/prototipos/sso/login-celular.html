<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Login — celular · esboço</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#5b4bdb}a:hover{color:#4335b8}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #14142b; background: #f4f5f9;">
  <div style="background: #1d1a40; color: #ffffff; padding: 40px 24px 36px; display: flex; flex-direction: column; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="34" height="31" viewBox="0 0 42 38" aria-hidden="true"><rect x="19.5" y="1" width="3" height="6" rx="1.5" fill="#8f86ff"></rect><circle cx="21" cy="2.5" r="2.5" fill="#8f86ff"></circle><rect x="0" y="16" width="5" height="11" rx="2.5" fill="#8f86ff"></rect><rect x="37" y="16" width="5" height="11" rx="2.5" fill="#8f86ff"></rect><rect x="4" y="7" width="34" height="28" rx="10" fill="#7b6ff5"></rect><rect x="9" y="13" width="24" height="16" rx="7" fill="#e9e6ff"></rect><circle cx="16" cy="21" r="3" fill="#3d32b8"></circle><circle cx="26" cy="21" r="3" fill="#3d32b8"></circle></svg>
      <span style="font-size: 18px; font-weight: 700;">QA AI Agent</span>
      <span style="background: #5b4bdb; color: #ffffff; font-size: 10.5px; font-weight: 700; padding: 3px 6px; border-radius: 6px;">MVP</span>
    </div>
    <h1 style="margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;">Qualidade das suas pipelines, em tempo real.</h1>
  </div>

  <div style="flex-grow: 1; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700;">Entrar</h2>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.5; color: #55576b;">Use a conta da sua empresa.</p>
    </div>
    <button type="button" style="height: 50px; border: 0; border-radius: 10px; background: #5b4bdb; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="m10.8 12.2 8.2-8.2M17 6l2.5 2.5M14.5 8.5 17 11"></path></svg>
      Entrar com SSO corporativo
    </button>
    <div style="display: flex; align-items: center; gap: 12px; color: #6b6d80; font-size: 13px;">
      <div style="flex-grow: 1; height: 1px; background: #e2e4ec;"></div>
      <span>ou informe seu e-mail</span>
      <div style="flex-grow: 1; height: 1px; background: #e2e4ec;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="emailm" style="font-size: 14px; font-weight: 600;">E-mail corporativo</label>
      <input id="emailm" type="email" placeholder="nome@suaempresa.com.br" style="height: 48px; box-sizing: border-box; border: 1px solid #d9dbe5; border-radius: 10px; padding: 0 14px; font-family: inherit; font-size: 16px; background: #ffffff; color: #14142b;">
    </div>
    <button type="button" style="height: 48px; border: 1px solid #cfc9f7; border-radius: 10px; background: #ffffff; color: #5b4bdb; font-family: inherit; font-size: 15px; font-weight: 600;">Continuar</button>
    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; color: #6b6d80;">
      <a href="#ajuda" style="font-weight: 600; text-decoration: none;">Problemas para entrar?</a>
      <span>Acesso restrito a colaboradores autorizados.</span>
    </div>
  </div>
</div>
</body>
</html>
